<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PrimoWords · 查词</title>
  <link rel="stylesheet" href="popup.css">
  <script src="ui-language.js"></script>
  <script defer src="lookup-card.js"></script>
  <script defer src="popup.js"></script>
</head>
<body class="lookup-page">
  <div class="lookup-frame">
    <header class="lookup-topbar">
      <a class="brand-lockup" href="workspace.html#lookup" aria-label="PrimoWords 查词收藏">
        <span class="brand-icon"><img src="icon.png" alt="" width="36" height="36"></span>
        <span class="brand-copy"><strong>PrimoWords</strong><small>查词</small></span>
      </a>
      <div class="lookup-header-tools">
        <span class="account-pill" id="popup-nickname" hidden></span>
        <button id="open-settings" class="icon-button" type="button">设置</button>
      </div>
    </header>

    <main class="lookup-main">
      <section class="lookup-intro" aria-labelledby="lookup-title">
        <p class="eyebrow">WEB DICTIONARY</p>
        <h1 id="lookup-title">查清楚，再决定要不要收藏。</h1>
        <p>优先查询项目词卡与离线词典；没有词卡时自动切换到必应词典。</p>
      </section>

      <form id="lookup" class="search-panel">
        <label for="word">查找英文单词</label>
        <div class="search-control">
          <input id="word" required maxlength="121" placeholder="输入单词，例如 command" autocomplete="off" spellcheck="false">
          <button type="submit"><span>查词</span><span aria-hidden="true">↗</span></button>
        </div>
        <p class="search-hint">在网页上双击单词，也可以直接在原文旁查词。</p>
      </form>
      <p id="lookup-status" class="page-status" role="status"></p>
      <div id="result" hidden></div>
    </main>

    <footer class="lookup-footer">
      <span><i aria-hidden="true"></i> 本地词卡优先</span>
      <a href="workspace.html#settings">设置收藏去向 <span aria-hidden="true">→</span></a>
    </footer>
  </div>
</body>
</html>
